# Paths below are relative to THIS YAML file, not cron's working directory.
interval_minutes: 5
label: starlink-home

output:
  log_file: var/history.jsonl
  state_file: var/state.json
  lock_file: var/run.lock

network:
  family: ipv4                    # ipv4 or ipv6; use a separate config/state for each
  endpoints:
    - https://api.ipify.org       # Must return just a public IP as plain text
  curl_binary: /usr/bin/curl
  timeout_seconds: 15             # Per HTTP attempt
  connect_timeout_seconds: 5
  attempts: 2                     # Total attempts per URL, including the first
  bypass_proxy: true              # Ignore HTTP(S)_PROXY environment variables
  interface: null                # Optional interface name, e.g. eth0

geoip:
  enabled: true
  endpoint: https://ipwho.is/{ip}  # Adapter requires the ipwho.is response schema
  cache_ttl_minutes: 1440         # Refresh once per day for an unchanged IP; 0 disables reuse

email:
  enabled: false                  # true: send an email when the observed IP changes
  smtp_host: smtp.example.com
  smtp_port: 587                  # Default: 587 for starttls, 465 for tls
  security: starttls              # starttls or tls (implicit TLS); plaintext SMTP is not supported
  ca_file: null                   # Optional PEM CA bundle; default is the system CA store
  username: you@example.com       # null only for a server that accepts mail without login
  password_file: ~/.config/ipwatch/smtp-password  # Mode 0600; first line is the password
  password_env: null              # Alternative to password_file: environment variable name
  from: ipwatch <you@example.com>
  to:
    - you@example.com
  subject_prefix: "[ipwatch]"
  timeout_seconds: 20             # Per SMTP network operation
