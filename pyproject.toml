[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "external-ip-monitor"
version = "1.0.1"
description = "Cron- or systemd-timer-driven external IP history with GeoIP enrichment and JSON Lines logging"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.scripts]
ipwatch = "ipwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
