[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "external-ip-monitor"
version = "0.1.0"
description = "Cron-driven external IP history with GeoIP enrichment and JSON Lines logging"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.scripts]
ipwatch = "ipwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
